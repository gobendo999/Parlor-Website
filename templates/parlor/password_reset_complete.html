{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে | Nishi Makeup Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose-gold: #B76E79;
      --rose-gold-dark: #8F4C57;
      --champagne-gold: #D4AF37;
      --text-dark: #2C1820;
      --text-muted: #7A656E;
      --white: #FFFFFF;
      --shadow-soft: 0 20px 45px rgba(183, 110, 121, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hind Siliguri', 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #FFF0F5 0%, #FDF7F4 40%, #F5EBE6 90%);
      color: var(--text-dark);
      padding: 1.5rem;
    }
    .card-container {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: var(--shadow-soft);
      padding: 3.2rem 2.5rem 2.8rem;
      text-align: center;
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.4rem;
      background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      border: 2px solid #10B981;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: #065F46;
      margin-bottom: 0.8rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-dark);
      margin-bottom: 2rem;
    }
    .btn-action {
      display: inline-block;
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--champagne-gold) 0%, var(--rose-gold) 100%);
      color: #FFF;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 6px 18px rgba(183, 110, 121, 0.3);
      transition: all 0.3s;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(183, 110, 121, 0.4);
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="icon-wrap">🎉</div>
    <h1>পাসওয়ার্ড সফলভাবে পরিবর্তিত হয়েছে!</h1>
    <p>আপনার অ্যাকাউন্টের নতুন পাসওয়ার্ড সফলভাবে আপডেট করা হয়েছে। এখন আপনি আপনার নতুন পাসওয়ার্ড দিয়ে সরাসরি CMS ড্যাশবোর্ডে লগইন করতে পারবেন।</p>

    <a href="{% url 'parlor:portal_login' %}" class="btn-action">
      👉 এখনই লগইন করুন
    </a>
  </div>
</body>
</html>
