{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পাসওয়ার্ড রিসেট | Nishi Makeup Studio Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose-gold: #B76E79;
      --rose-gold-dark: #8F4C57;
      --champagne-gold: #D4AF37;
      --text-dark: #2C1820;
      --text-muted: #7A656E;
      --white: #FFFFFF;
      --shadow-soft: 0 20px 45px rgba(183, 110, 121, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hind Siliguri', 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #FFF0F5 0%, #FDF7F4 40%, #F5EBE6 90%);
      color: var(--text-dark);
      padding: 1.5rem;
    }
    .reset-container {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: var(--shadow-soft);
      padding: 3rem 2.5rem 2.8rem;
      text-align: center;
    }
    .crest-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2.5px solid var(--champagne-gold);
      box-shadow: 0 8px 22px rgba(212, 175, 55, 0.35);
      margin-bottom: 1.2rem;
      overflow: hidden;
      background: #FFF;
    }
    .crest-wrap img { width: 100%; height: 100%; object-fit: cover; }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--rose-gold-dark);
      margin-bottom: 0.3rem;
    }
    .subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 1.8rem;
      line-height: 1.5;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.5rem;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.4rem;
    }
    .form-control {
      width: 100%;
      padding: 0.85rem 1.1rem;
      font-size: 0.95rem;
      border: 1.5px solid rgba(183, 110, 121, 0.3);
      border-radius: 12px;
      outline: none;
      transition: all 0.25s ease;
      background: #FFFDFE;
    }
    .form-control:focus {
      border-color: var(--champagne-gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--champagne-gold) 0%, var(--rose-gold) 100%);
      color: #FFF;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(183, 110, 121, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(183, 110, 121, 0.4);
    }
    .back-link {
      margin-top: 1.8rem;
      font-size: 0.88rem;
    }
    .back-link a {
      color: var(--rose-gold-dark);
      text-decoration: none;
      font-weight: 600;
    }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="crest-wrap">
      <img src="/static/images/parlor_logo.jpg" alt="Logo" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=100';">
    </div>

    <h1>পাসওয়ার্ড রিসেট</h1>
    <p class="subtitle">আপনার অ্যাকাউন্টে রেজিস্টার্ড জিমেইল অ্যাড্রেসটি লিখুন। আমরা আপনাকে একটি ওয়ান-টাইম পাসওয়ার্ড রিসেট লিংক পাঠাব।</p>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_email">জিমেইল অ্যাড্রেস (Gmail Address)</label>
        <input 
          type="email" 
          name="email" 
          id="id_email" 
          class="form-control" 
          placeholder="আপনার রেজিস্টার্ড ইমেইল দিন (e.g. owner@gmail.com)" 
          required 
          autocomplete="email"
        >
      </div>

      <button type="submit" class="btn-submit">
        <span>রিসেট লিংক পাঠান</span>
        <span>📩</span>
      </button>
    </form>

    <div class="back-link">
      <a href="{% url 'parlor:portal_login' %}">← লগইন পেজে ফিরে যান</a>
    </div>
  </div>
</body>
</html>
